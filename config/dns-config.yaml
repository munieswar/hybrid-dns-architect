# Hybrid DNS Architect Configuration
# This file defines DNS providers and routing policies

# DNS Providers
providers:
  # Public DNS provider (Google DNS)
  - name: google-dns
    type: public
    config:
      provider: google  # Options: google, cloudflare, quad9
      timeout: 5.0
      lifetime: 10.0
      health_check_domain: google.com

  # Public DNS provider (Cloudflare)
  - name: cloudflare-dns
    type: public
    config:
      provider: cloudflare
      timeout: 5.0
      lifetime: 10.0

  # Private DNS (example for corporate network)
  - name: corporate-dns
    type: private
    config:
      servers:
        - 10.0.0.1
        - 10.0.0.2
      timeout: 3.0
      health_check_domain: internal.corp.local

  # Cloud DNS (AWS Route53 example)
  - name: aws-dns
    type: cloud
    config:
      cloud_provider: aws
      servers:
        - 8.8.8.8  # Replace with your AWS DNS servers
      timeout: 5.0

# DNS Routing Policies
# Policies are evaluated in priority order (lower number = higher priority)
policies:
  # Route internal corporate domains to private DNS
  - name: corporate-internal
    patterns:
      - "*.corp.local"
      - "*.internal"
      - "*.intranet"
    providers:
      - corporate-dns
    priority: 10

  # Route AWS-specific domains to AWS DNS
  - name: aws-services
    patterns:
      - "*.amazonaws.com"
      - "*.aws.com"
    providers:
      - aws-dns
      - google-dns
    priority: 20

  # Route common public domains to fast public DNS
  - name: public-websites
    patterns:
      - "*.com"
      - "*.net"
      - "*.org"
    providers:
      - cloudflare-dns
      - google-dns
    priority: 50

# Cache configuration
cache:
  ttl: 300  # Cache TTL in seconds (5 minutes)
